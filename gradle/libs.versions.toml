[versions]
asciiDoctorVersion = "4.0.5"
kotlinVersion = "2.4.21"
openApiGradlePluginVersion = "1.9.0"
springBootVersion = "4.1.1"
sqliteJdbcVersion = "3.53.4.0"
swaggerCodeGenVersion = "3.0.82"
swaggerGeneratorVersion = "2.19.2"

[libraries]
sqlite-jdbc = { group="org.xerial", name="sqlite-jdbc", version.ref="sqliteJdbcVersion" }
swagger-codegen = { group="io.swagger.codegen.v3", name="swagger-codegen-cli", version.ref="swaggerCodeGenVersion"}

[plugins]
ascii-doctor = { id="org.asciidoctor.jvm.convert", version.ref="asciiDoctorVersion" }
jvm = { id="org.jetbrains.kotlin.jvm", version.ref="kotlinVersion" }
spring = { id="org.jetbrains.kotlin.plugin.spring", version.ref="kotlinVersion"}
open-api = { id="org.springdoc.openapi-gradle-plugin", version.ref="openApiGradlePluginVersion"}
spring-boot = { id="org.springframework.boot", version.ref="springBootVersion" }
swagger-generator = { id="org.hidetake.swagger.generator", version.ref="swaggerGeneratorVersion" }