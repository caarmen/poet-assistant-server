spring.datasource.url=jdbc:sqlite:modules/app/src/main/resources/poet_assistant.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true
hibernate.dialect=org.hibernate.dialect.SQLiteDialect
hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
springdoc.packagesToScan=ca.rmen.poetassistant.api
springdoc.pathsToMatch=/rhymes,/thesaurus,/definitions,/wotd